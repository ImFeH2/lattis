[package]
name = "netlab"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
netlab-tests = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
ipnet = "2"
nix = { version = "0.30", default-features = false, features = [
    "fs",
    "mount",
    "sched",
] }
rtnetlink = "0.21"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[[test]]
name = "host"
path = "tests/host.rs"
required-features = ["netlab-tests"]

[[test]]
name = "lan"
path = "tests/lan.rs"
required-features = ["netlab-tests"]
