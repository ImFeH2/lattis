name: Netlab

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: netlab-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  netlab:
    name: Netlab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nftables

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ""

      - name: Check Rust formatting
        run: cargo fmt -p netlab --check

      - name: Lint Rust
        run: cargo clippy -p netlab --all-targets --features netlab-tests --locked -- -D warnings

      - name: Test Rust
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: cargo test -p netlab --features netlab-tests --locked

      - name: Build netlab
        run: cargo build -p netlab --locked
