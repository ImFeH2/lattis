name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.9

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          target: wasm32-unknown-unknown,x86_64-apple-ios,x86_64-linux-android
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Dioxus format
        run: dx fmt --check

      - name: Cargo lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dioxus check web
        run: dx check --package web --platform web --locked

      - name: Dioxus check Linux
        run: dx check --package desktop --platform linux --locked

      - name: Dioxus check macOS
        run: dx check --package desktop --platform macos --locked

      - name: Dioxus check Windows
        run: dx check --package desktop --platform windows --locked

      - name: Dioxus check Android
        run: dx check --package mobile --platform android --locked

      - name: Dioxus check iOS
        run: dx check --package mobile --platform ios --locked

      - name: Cargo test
        run: cargo test --workspace --locked

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install web dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binaryen

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Build web
        run: dx build --package web --platform web --release --locked

      - name: Archive web
        run: |
          mkdir -p release
          tar -C target/dx/web/release/web/public -czf "release/Lattis-${GITHUB_REF_NAME}-web.tar.gz" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release/*
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Bundle Linux
        run: dx bundle --package desktop --platform linux --release --locked --package-types deb --out-dir dist/linux

      - name: Archive Linux
        run: |
          mkdir -p release
          deb_path="$(find dist/linux -name "*.deb" -type f | sort | head -n 1)"
          test -n "$deb_path"
          cp "$deb_path" "release/Lattis-${GITHUB_REF_NAME}-linux.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Bundle macOS
        run: dx bundle --package desktop --platform macos --release --locked --package-types dmg --codesign false --out-dir dist/macos

      - name: Archive macOS
        run: |
          mkdir -p release
          dmg_path="$(find dist/macos -name "*.dmg" -type f | sort | head -n 1)"
          test -n "$dmg_path"
          cp "$dmg_path" "release/Lattis-${GITHUB_REF_NAME}-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Windows dependencies
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Bundle Windows
        shell: bash
        run: dx bundle --package desktop --platform windows --release --locked --package-types nsis --out-dir dist/windows

      - name: Archive Windows
        shell: bash
        run: |
          mkdir -p release
          installer_path="$(find dist/windows -name "*.exe" -type f | sort | head -n 1)"
          test -n "$installer_path"
          cp "$installer_path" "release/Lattis-${GITHUB_REF_NAME}-windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Bundle Android
        run: dx bundle --package mobile --platform android --release --locked --package-types apk --out-dir dist/android

      - name: Build unsigned Android release APK
        run: |
          gradle_wrapper="$(find target/dx -path "*/release/android/app/gradlew" -type f | sort | head -n 1)"
          test -n "$gradle_wrapper"
          gradle_project="$(dirname "$gradle_wrapper")"
          "$gradle_wrapper" -p "$gradle_project" assembleRelease

      - name: Archive Android
        run: |
          mkdir -p release
          apk_path="$(find target/dx -path "*/release/android/app/app/build/outputs/apk/release/*-unsigned.apk" -type f | sort | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" "release/Lattis-${GITHUB_REF_NAME}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release/*
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1
        with:
          version: 1.19.1

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --force --locked

      - name: Bundle iOS
        run: dx bundle --package mobile --platform ios --release --locked --package-types ios --codesign false --out-dir dist/ios

      - name: Archive iOS
        run: |
          mkdir -p release
          app_path="$(find dist/ios -name "*.app" -type d | head -n 1)"
          test -n "$app_path"
          staging_dir="$(mktemp -d)"
          mkdir -p "$staging_dir/Payload"
          ditto "$app_path" "$staging_dir/Payload/$(basename "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$staging_dir/Payload" "release/Lattis-${GITHUB_REF_NAME}-ios.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - web
      - linux
      - macos
      - windows
      - android
      - ios
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -maxdepth 2 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
