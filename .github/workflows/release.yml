name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  netlab:
    name: Netlab
    uses: ./.github/workflows/netlab.yml

  release:
    name: Draft release
    needs:
      - ci
      - netlab
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME"

  app:
    name: App (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
          - name: macOS arm64
            os: macos-15
            platform: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: 0

      - name: Build and upload app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          releaseAssetNamePattern: lattis-app-v[version]-${{ matrix.platform }}[ext]

  cli:
    name: CLI (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
          - name: macOS arm64
            os: macos-15
            platform: macos-arm64
          - name: macOS x64
            os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Build CLI
        run: cargo build -p lattis-cli --bin lattis --release --locked

      - name: Prepare CLI
        env:
          CLI_EXTENSION: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          mkdir -p release
          cp "target/release/lattis${CLI_EXTENSION}" \
            "release/lattis-cli-${GITHUB_REF_NAME}-${{ matrix.platform }}${CLI_EXTENSION}"

      - name: Upload CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  publish:
    name: Publish
    needs:
      - app
      - cli
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
