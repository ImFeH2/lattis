name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: 30.0.14904198
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cargo format
        run: cargo fmt --all --check

      - name: Cargo lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend check
        run: pnpm --dir ui run check

  linux:
    name: App Linux
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Linux
        run: cargo tauri build --bundles deb --ci

      - name: Archive Linux
        run: |
          mkdir -p release
          deb_path="$(find target/release/bundle/deb -name "*.deb" -type f | sort | head -n 1)"
          test -n "$deb_path"
          cp "$deb_path" "release/Lattis-${GITHUB_REF_NAME}-linux.deb"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  cli-linux:
    name: CLI Linux
    runs-on: ubuntu-latest
    needs: rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p lattis-cli --bin lattis --release --locked

      - name: Archive CLI
        run: |
          mkdir -p release
          tar -czf "release/lattis-${GITHUB_REF_NAME}-linux.tar.gz" -C target/release lattis

      - name: Upload CLI Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-linux
          path: release/*
          if-no-files-found: error

  macos:
    name: App macOS
    runs-on: macos-latest
    needs:
      - frontend-quality
      - rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle macOS
        run: cargo tauri build --no-sign --ci

      - name: Archive macOS
        run: |
          mkdir -p release
          dmg_path="$(find target/release/bundle/dmg -name "*.dmg" -type f | sort | head -n 1)"
          test -n "$dmg_path"
          cp "$dmg_path" "release/Lattis-${GITHUB_REF_NAME}-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  cli-macos:
    name: CLI macOS
    runs-on: macos-latest
    needs: rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p lattis-cli --bin lattis --release --locked

      - name: Archive CLI
        run: |
          mkdir -p release
          tar -czf "release/lattis-${GITHUB_REF_NAME}-macos.tar.gz" -C target/release lattis

      - name: Upload CLI macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-macos
          path: release/*
          if-no-files-found: error

  windows:
    name: App Windows
    runs-on: windows-latest
    needs:
      - frontend-quality
      - rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Windows dependencies
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        shell: bash
        run: corepack enable

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Bundle Windows
        shell: bash
        run: cargo tauri build --ci

      - name: Archive Windows
        shell: bash
        run: |
          mkdir -p release
          installer_path="$(find target/release/bundle/nsis -name "*.exe" -type f | sort | head -n 1)"
          test -n "$installer_path"
          cp "$installer_path" "release/Lattis-${GITHUB_REF_NAME}-windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  cli-windows:
    name: CLI Windows
    runs-on: windows-latest
    needs: rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        shell: bash
        run: cargo build -p lattis-cli --bin lattis --release --locked

      - name: Archive CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path target/release/lattis.exe -DestinationPath "release/lattis-${env:GITHUB_REF_NAME}-windows.zip"

      - name: Upload CLI Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-cli-windows
          path: release/*
          if-no-files-found: error

  android:
    name: App Android
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
      - rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Android
        run: cargo tauri android build --apk --target aarch64 --ci

      - name: Archive Android
        run: |
          mkdir -p release
          apk_path="$(find app/gen/android/app/build/outputs/apk -path "*/release/*.apk" -type f | sort | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" "release/Lattis-${GITHUB_REF_NAME}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release/*
          if-no-files-found: error

  ios:
    name: App iOS Simulator
    runs-on: macos-latest
    needs:
      - frontend-quality
      - rust-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios-sim
          rustflags: ""

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: cargo tauri ios init --ci --skip-targets-install

      - name: Bundle iOS simulator
        run: cargo tauri ios build --debug --target aarch64-sim --ci

      - name: Archive iOS simulator
        run: |
          mkdir -p release
          app_path="$(find app/gen/apple target -name "*.app" -type d | sort | head -n 1)"
          test -n "$app_path"
          ditto -c -k --keepParent "$app_path" "release/Lattis-${GITHUB_REF_NAME}-ios-simulator.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - cli-linux
      - macos
      - cli-macos
      - windows
      - cli-windows
      - android
      - ios
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -maxdepth 2 -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Lattis ${{ github.ref_name }}
          files: release-assets/*
