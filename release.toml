allow-branch = ["main"]
shared-version = true
dependent-version = "upgrade"
metadata = "optional"

consolidate-commits = true
pre-release-commit-message = "chore: release {{version}}"
pre-release-replacements = [
  { file = "package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"' },
  { file = "app/package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"' },
  { file = "ui/package.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"' },
  { file = "app/tauri.conf.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"' },
]

tag-name = "v{{version}}"
tag-message = "chore: release {{version}}"
sign-commit = true
sign-tag = true

publish = false
verify = false

push = true
push-remote = "origin"
