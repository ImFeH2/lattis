[package]
name = "lattis-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
netns-tests = []

[dependencies]
anyhow = "1"
etherparse = "0.20"
if-addrs = "0.15"
ipnet = "2"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tun-rs = { version = "2.0", features = ["async"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
net-topo = { workspace = true }

[[test]]
name = "netns"
path = "tests/netns/mod.rs"
required-features = ["netns-tests"]
