repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
        exclude: (^|/)tsconfig(\.[^/]+)?\.json$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo format
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types_or: [rust, toml]

      - id: cargo-clippy
        name: Cargo lint
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust, toml]

      - id: cargo-test
        name: Cargo test
        entry: cargo test --workspace
        language: system
        pass_filenames: false
        types_or: [rust, toml]

      - id: frontend-check
        name: Frontend check
        entry: pnpm --dir ui run check
        language: system
        pass_filenames: false
        files: ^(ui/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$)
